name: Runtime CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify-runtime:
    name: Verify local runtime package
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_APP_ENV: local
      NEXT_PUBLIC_SUPABASE_ENV: local
      NEXT_DIST_DIR: .next-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source-backed runtime requirements
        run: npm run verify:requirements

      - name: Report platform environment contract
        run: npm run verify:platform

      - name: Verify Supabase migration guardrails
        run: npm run verify:migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js package
        run: npm run build
